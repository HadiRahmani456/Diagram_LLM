<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - IdeaDiagram AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 400px;
            max-width: 90%;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743);
            background-clip: text;;
            -webkit-text-fill-color: transparent;
        }
        p { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #f09433; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #f09433, #e6683c);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(240, 148, 51, 0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #f09433; text-decoration: none; }
        .error { color: #ff4444; text-align: center; margin-top: 10px; display: none; }
        .error.active { display: block; }
        .loading { display: none; text-align: center; margin-top: 10px; color: #f09433; }
        .loading.active { display: block; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🚀 IdeaDiagram AI</h1>
        <p>وارد حساب کاربری خود شوید</p>
        
        <input type="text" id="username" placeholder="نام کاربری">
        <input type="password" id="password" placeholder="رمز عبور">
        <button id="loginBtn" onclick="login()">✨ ورود</button>
        
        <div class="loading" id="loading">⏳ در حال ورود...</div>
        <div class="error" id="error"></div>
        
        <div class="link">
            حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://diagram-api-nrt3.onrender.com/api/v1';
        const API_URL = 'https://diagram-api-nrt3.onrender.com/api/v1';

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showError('لطفاً همه فیلدها را پر کنید');
                return;
            }
            
            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            
            btn.disabled = true;
            loading.classList.add('active');
            hideError();
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'خطا در ورود');
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('username', username);
                
                window.location.href = 'index.html';
                
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }
        
        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + msg;
            error.classList.add('active');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('active');
        }
        
        // Enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
